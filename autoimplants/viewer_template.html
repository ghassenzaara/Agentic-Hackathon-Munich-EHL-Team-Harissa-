<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
  :root {
    --ground: #f2f3f5;
    --panel: #ffffff;
    --panel-sunk: #eaecef;
    --viewport: #e7eaee;
    --viewport-far: #d9dde3;
    --ink: #16191d;
    --ink-dim: #5a626c;
    --ink-faint: #8b939d;
    --line: #dde1e6;
    --line-strong: #c6ccd4;
    --accent: #3e6e8e;
    --accent-soft: #dbe6ee;
    --pass: #2e7d5b;
    --fail: #b3402e;
    --skip: #7a8290;
    --error: #8c3a6b;
    --bone: #d8cfc0;
    --metal: #8fa3b0;
    --shadow: 0 1px 2px rgba(16, 25, 35, .06), 0 8px 24px rgba(16, 25, 35, .06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101317;
      --panel: #171b21;
      --panel-sunk: #12161b;
      --viewport: #0b0d10;
      --viewport-far: #05070a;
      --ink: #e6e9ed;
      --ink-dim: #939ba6;
      --ink-faint: #6e7681;
      --line: #262c34;
      --line-strong: #333b45;
      --accent: #6fa8c9;
      --accent-soft: #1b2932;
      --pass: #4caf87;
      --fail: #e06a52;
      --skip: #6e7681;
      --error: #c47bab;
      --bone: #c9bfae;
      --metal: #7f94a3;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    }
  }

  :root[data-theme="dark"] {
    --ground: #101317;
    --panel: #171b21;
    --panel-sunk: #12161b;
    --viewport: #0b0d10;
    --viewport-far: #05070a;
    --ink: #e6e9ed;
    --ink-dim: #939ba6;
    --ink-faint: #6e7681;
    --line: #262c34;
    --line-strong: #333b45;
    --accent: #6fa8c9;
    --accent-soft: #1b2932;
    --pass: #4caf87;
    --fail: #e06a52;
    --skip: #6e7681;
    --error: #c47bab;
    --bone: #c9bfae;
    --metal: #7f94a3;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
    max-height: 100vh;
  }

  /* ---- header ---- */

  header {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px 22px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .case-id {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  .verdict {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    padding: 3px 9px;
    border-radius: 3px;
  }
  .verdict.pass { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.fail { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }

  .tally {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    font-size: 13px;
  }

  .meta {
    margin-left: auto;
    color: var(--ink-faint);
    font-size: 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }

  /* ---- body split ---- */

  .split {
    display: grid;
    grid-template-columns: 1fr 380px;
    min-height: 0;
  }

  @media (max-width: 900px) {
    .shell { max-height: none; }
    .split { grid-template-columns: 1fr; }
    .stage { height: 62vh; }
  }

  /* ---- viewport ---- */

  .stage {
    position: relative;
    background: radial-gradient(ellipse at 50% 38%, var(--viewport), var(--viewport-far));
    min-height: 0;
    overflow: hidden;
  }

  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }

  .controls {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .04em;
    padding: 5px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    color: var(--ink-dim);
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .chip[aria-pressed="true"] {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .readout {
    position: absolute;
    left: 14px;
    bottom: 14px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .hint {
    position: absolute;
    right: 14px;
    bottom: 14px;
    font-size: 11px;
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }

  /* ---- check rail ---- */

  .rail {
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    min-height: 0;
  }

  .rail-head {
    position: sticky;
    top: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 13px 16px 11px;
    z-index: 2;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .rail-note { margin: 5px 0 0; color: var(--ink-dim); font-size: 12px; }

  .check {
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 0 12px;
    width: 100%;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 0;
    cursor: default;
  }
  .check.locatable { cursor: pointer; }
  .check.locatable:hover { background: var(--panel-sunk); }
  .check:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .check[aria-current="true"] { background: var(--accent-soft); }

  .stripe { background: var(--line); }
  .check.s-PASS .stripe { background: var(--pass); }
  .check.s-FAIL .stripe { background: var(--fail); }
  .check.s-SKIP .stripe { background: var(--skip); }
  .check.s-ERROR .stripe { background: var(--error); }

  .check-body { padding: 11px 16px 12px 4px; min-width: 0; }

  .check-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .check-id {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .num {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    white-space: nowrap;
    color: var(--ink-dim);
  }
  .num b { font-weight: 600; color: var(--ink); }
  .check.s-FAIL .num b { color: var(--fail); }

  .check-msg {
    margin: 5px 0 0;
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.45;
  }

  .loc {
    margin-top: 6px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="shell">
  <header>
    <span class="case-id">{{CASE_ID}}</span>
    <span class="verdict {{VERDICT_CLASS}}">{{VERDICT}}</span>
    <span class="tally">{{PASS_COUNT}}/{{TOTAL_COUNT}} checks passing</span>
    <span class="meta">{{META}}</span>
  </header>

  <div class="split">
    <div class="stage">
      <canvas id="view"></canvas>
      <div class="controls">
        <button class="chip" id="t-bone" aria-pressed="true">bone</button>
        <button class="chip" id="t-ghost" aria-pressed="false">ghost</button>
        <button class="chip" id="t-implant" aria-pressed="true">implant</button>
        <button class="chip" id="t-marks" aria-pressed="true">findings</button>
        <button class="chip" id="t-reset">reset view</button>
      </div>
      <div class="readout">
        <span id="r-orient">azimuth 0&deg; &middot; elevation 0&deg;</span>
        <span id="r-scale">&mdash;</span>
      </div>
      <p class="hint">drag to orbit &middot; scroll to zoom</p>
    </div>

    <aside class="rail">
      <div class="rail-head">
        <div class="eyebrow">Validation report</div>
        <p class="rail-note">Checks with a reported location are clickable &mdash; the camera aims at the coordinate the validator measured.</p>
      </div>
      <div id="checks"></div>
    </aside>
  </div>
</div>

<script id="payload" type="application/json">{{DATA}}</script>
<script>
(() => {
  "use strict";

  const DATA = JSON.parse(document.getElementById("payload").textContent);
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- geometry ------------------------------------------------------------
  // Meshes arrive as flat arrays. Everything is kept in typed arrays and the
  // whole scene is depth-sorted as one list, so the implant and the bone
  // interleave correctly instead of one always drawing over the other.

  const meshes = DATA.meshes.map((m) => ({
    name: m.name,
    color: m.color,
    verts: Float32Array.from(m.v),
    faces: Uint32Array.from(m.f),
    visible: true,
    alpha: 1,
    spec: m.name === "implant",
  }));

  const all = Float32Array.from(meshes.flatMap((m) => Array.from(m.verts)));
  const centre = [0, 0, 0];
  const lo = [Infinity, Infinity, Infinity];
  const hi = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < all.length; i += 3) {
    for (let k = 0; k < 3; k++) {
      lo[k] = Math.min(lo[k], all[i + k]);
      hi[k] = Math.max(hi[k], all[i + k]);
    }
  }
  for (let k = 0; k < 3; k++) centre[k] = (lo[k] + hi[k]) / 2;
  const extent = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) || 1;

  // The plate mounts on +X, so the camera opens looking down +X with a small
  // offset -- dead-on is edge-on to a flat plate and reads as a stripe. Getting
  // this wrong hides the implant behind the bone, which is the one thing the
  // page exists to show.
  const HOME = { az: 74, el: 12, zoom: 1, tx: 0, ty: 0 };
  const cam = { ...HOME };

  let totalFaces = 0;
  for (const m of meshes) totalFaces += m.faces.length / 3;
  const order = new Uint32Array(totalFaces);
  const depth = new Float32Array(totalFaces);
  const owner = new Uint8Array(totalFaces);
  const faceIx = new Uint32Array(totalFaces);
  const projected = meshes.map((m) => new Float32Array(m.verts.length));

  function rotation() {
    const a = (cam.az * Math.PI) / 180;
    const e = (cam.el * Math.PI) / 180;
    const ca = Math.cos(a), sa = Math.sin(a);
    const ce = Math.cos(e), se = Math.sin(e);
    // Z is the shaft axis, so it stays vertical on screen: yaw about Z, then
    // pitch. A free trackball would let the femur tumble, which reads as broken
    // to anyone used to a planning viewer.
    return [
      ca, -sa, 0,
      se * sa, se * ca, -ce,
      ce * sa, ce * ca, se,
    ];
  }

  let scalePxPerMm = 1, originX = 0, originY = 0;

  function project() {
    const R = rotation();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    scalePxPerMm = (Math.min(w, h) / extent) * 0.78 * cam.zoom;
    originX = w / 2 + cam.tx;
    originY = h / 2 + cam.ty;

    for (let mi = 0; mi < meshes.length; mi++) {
      const v = meshes[mi].verts, out = projected[mi];
      for (let i = 0; i < v.length; i += 3) {
        const x = v[i] - centre[0], y = v[i + 1] - centre[1], z = v[i + 2] - centre[2];
        const rx = R[0] * x + R[1] * y + R[2] * z;
        const ry = R[3] * x + R[4] * y + R[5] * z;
        const rz = R[6] * x + R[7] * y + R[8] * z;
        out[i] = originX + rx * scalePxPerMm;
        out[i + 1] = originY - ry * scalePxPerMm;
        out[i + 2] = rz;
      }
    }
    return R;
  }

  function projectPoint(p, R) {
    const x = p[0] - centre[0], y = p[1] - centre[1], z = p[2] - centre[2];
    const rx = R[0] * x + R[1] * y + R[2] * z;
    const ry = R[3] * x + R[4] * y + R[5] * z;
    const rz = R[6] * x + R[7] * y + R[8] * z;
    return [originX + rx * scalePxPerMm, originY - ry * scalePxPerMm, rz];
  }

  const LIGHT = (() => {
    const l = [-0.42, -0.55, 0.72];
    const n = Math.hypot(l[0], l[1], l[2]);
    return [l[0] / n, l[1] / n, l[2] / n];
  })();

  function shade(hex, amount) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const f = (c) => Math.max(0, Math.min(255, Math.round(c * amount)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  let activeCheck = null;

  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const R = project();

    let n = 0;
    for (let mi = 0; mi < meshes.length; mi++) {
      const m = meshes[mi];
      if (!m.visible) continue;
      const p = projected[mi], f = m.faces;
      for (let i = 0; i < f.length; i += 3) {
        const a = f[i] * 3, b = f[i + 1] * 3, c = f[i + 2] * 3;
        depth[n] = (p[a + 2] + p[b + 2] + p[c + 2]) / 3;
        owner[n] = mi;
        faceIx[n] = i;
        order[n] = n;
        n++;
      }
    }

    const view = order.subarray(0, n);
    // Sort back-to-front. Painter's algorithm is exact enough here: the parts
    // are convex-ish and never interpenetrate -- if they did, that is itself a
    // failing check.
    Array.prototype.sort.call(view, (i, j) => depth[i] - depth[j]);

    for (let k = 0; k < n; k++) {
      const idx = view[k];
      const m = meshes[owner[idx]];
      const p = projected[owner[idx]];
      const f = m.faces, i = faceIx[idx];
      const a = f[i] * 3, b = f[i + 1] * 3, c = f[i + 2] * 3;

      const ux = p[b] - p[a], uy = p[b + 1] - p[a + 1], uz = p[b + 2] - p[a + 2];
      const vx = p[c] - p[a], vy = p[c + 1] - p[a + 1], vz = p[c + 2] - p[a + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;

      // Two-sided lighting: flip any normal pointing away from the camera before
      // shading it. Winding is not consistent between the two meshes -- the bone
      // comes from make_bone.py and the implant from a CAD kernel -- and lighting
      // a back-facing normal renders the whole plate at ambient, which read as a
      // black stripe on the bone. The face we can see is the one facing us.
      if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }

      const lambert = Math.max(0, nx * LIGHT[0] - ny * LIGHT[1] + nz * LIGHT[2]);
      const tone = 0.30 + 0.95 * lambert + (m.spec ? 0.55 * Math.pow(lambert, 9) : 0);

      ctx.beginPath();
      ctx.moveTo(p[a], p[a + 1]);
      ctx.lineTo(p[b], p[b + 1]);
      ctx.lineTo(p[c], p[c + 1]);
      ctx.closePath();
      ctx.globalAlpha = m.alpha;
      ctx.fillStyle = shade(m.color, tone);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (showMarks) drawMarks(R);
    drawScaleBar();

    document.getElementById("r-orient").textContent =
      `azimuth ${Math.round(((cam.az % 360) + 360) % 360)}° · elevation ${Math.round(cam.el)}°`;
  }

  function drawMarks(R) {
    const style = getComputedStyle(document.documentElement);
    for (const c of DATA.checks) {
      if (!c.location) continue;
      const isActive = activeCheck === c.id;
      if (c.status === "PASS" && !isActive) continue;

      const [x, y] = projectPoint(c.location, R);
      const color = style.getPropertyValue(c.status === "FAIL" ? "--fail" : "--accent").trim();
      const r = isActive ? 13 : 8;

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = isActive ? 2.5 : 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (isActive) {
        ctx.font = '600 11px "IBM Plex Mono", monospace';
        ctx.fillStyle = color;
        ctx.fillText(c.id, x + r + 6, y + 4);
      }
    }
  }

  function drawScaleBar() {
    const style = getComputedStyle(document.documentElement);
    const target = 90;
    const raw = target / scalePxPerMm;
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const mm = [1, 2, 5, 10].map((s) => s * pow).find((v) => v * scalePxPerMm >= 55) || pow * 10;
    const px = mm * scalePxPerMm;
    const y = canvas.clientHeight - 52;
    const x = 16;

    ctx.strokeStyle = style.getPropertyValue("--ink-faint").trim();
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + px, y);
    ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4);
    ctx.moveTo(x + px, y - 4); ctx.lineTo(x + px, y + 4);
    ctx.stroke();
    document.getElementById("r-scale").textContent = `scale bar ${mm} mm`;
  }

  // ---- interaction ---------------------------------------------------------

  let showMarks = true;
  let dragging = false, lastX = 0, lastY = 0, panning = false;

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    panning = e.shiftKey || e.button === 1;
    lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (panning) {
      cam.tx += dx; cam.ty += dy;
    } else {
      cam.az += dx * 0.5;
      cam.el = Math.max(-88, Math.min(88, cam.el + dy * 0.4));
    }
    draw();
  });

  const stop = (e) => {
    dragging = false;
    canvas.classList.remove("dragging");
    if (e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  };
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    cam.zoom = Math.max(0.3, Math.min(9, cam.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    draw();
  }, { passive: false });

  function toggle(id, fn) {
    const el = document.getElementById(id);
    el.addEventListener("click", () => {
      const next = el.getAttribute("aria-pressed") !== "true";
      el.setAttribute("aria-pressed", String(next));
      fn(next);
      draw();
    });
  }

  toggle("t-bone", (on) => { meshes[0].visible = on; });
  toggle("t-implant", (on) => { if (meshes[1]) meshes[1].visible = on; });
  toggle("t-marks", (on) => { showMarks = on; });
  toggle("t-ghost", (on) => { meshes[0].alpha = on ? 0.34 : 1; });

  document.getElementById("t-reset").addEventListener("click", () => {
    Object.assign(cam, HOME);
    activeCheck = null;
    for (const el of document.querySelectorAll(".check")) el.removeAttribute("aria-current");
    draw();
  });

  // ---- check rail ----------------------------------------------------------

  const rail = document.getElementById("checks");
  // Fixed en-US formatting on purpose: a comma-decimal locale turns 8.596 into
  // "8,596", which beside a "1,5 mm" limit reads as three thousand times over.
  const NUM = new Intl.NumberFormat("en-US", { maximumFractionDigits: 3 });
  const fmt = (v) => (v === null || v === undefined ? "—" : NUM.format(+v));

  for (const c of DATA.checks) {
    const el = document.createElement(c.location ? "button" : "div");
    el.className = `check s-${c.status}` + (c.location ? " locatable" : "");
    if (c.location) el.type = "button";

    const numbers = c.value === null || c.value === undefined
      ? `<span class="num">${c.status}</span>`
      : `<span class="num"><b>${fmt(c.value)}</b> / ${fmt(c.limit)} ${c.unit || ""}</span>`;

    el.innerHTML =
      `<span class="stripe"></span>` +
      `<span class="check-body">` +
      `<span class="check-top"><span class="check-id">${c.id}</span>${numbers}</span>` +
      (c.message ? `<p class="check-msg">${c.message}</p>` : "") +
      (c.location ? `<div class="loc">at ${c.location.map((n) => (+n).toFixed(1)).join(", ")} mm</div>` : "") +
      `</span>`;

    if (c.location) {
      el.addEventListener("click", () => {
        for (const other of document.querySelectorAll(".check")) other.removeAttribute("aria-current");
        el.setAttribute("aria-current", "true");
        activeCheck = c.id;
        // Aim at the finding: swing the camera round to face it and centre it.
        // A point at bearing theta in the XY plane has screen depth
        // cos(el) * sin(az + theta), so it faces the camera at az = 90 - theta.
        // The other sign puts the camera behind the bone, looking at the far side.
        const theta = Math.atan2(c.location[1] - centre[1], c.location[0] - centre[0]);
        aim(90 - (theta * 180) / Math.PI, 8, c.location);
      });
    }
    rail.appendChild(el);
  }

  function aim(az, el, point) {
    const from = { ...cam };
    const to = { az, el, zoom: Math.max(cam.zoom, 1.7) };
    const steps = reduceMotion ? 1 : 22;
    let i = 0;

    const step = () => {
      i++;
      const t = i / steps;
      const ease = 1 - Math.pow(1 - t, 3);
      cam.az = from.az + (to.az - from.az) * ease;
      cam.el = from.el + (to.el - from.el) * ease;
      cam.zoom = from.zoom + (to.zoom - from.zoom) * ease;

      // Keep the finding centred as the zoom changes.
      project();
      const p = projectPoint(point, rotation());
      cam.tx += (canvas.clientWidth / 2 - p[0]) * ease * 0.5;
      cam.ty += (canvas.clientHeight / 2 - p[1]) * ease * 0.5;

      draw();
      if (i < steps) requestAnimationFrame(step);
    };
    step();
  }

  window.addEventListener("resize", draw);
  const themeWatcher = window.matchMedia("(prefers-color-scheme: dark)");
  themeWatcher.addEventListener("change", draw);

  draw();
})();
</script>
