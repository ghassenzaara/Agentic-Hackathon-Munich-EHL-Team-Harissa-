# conda is the portable route because CalculiX is on conda-forge and not PyPI.
# This is also the shape a Devin machine snapshot should have.
#   conda env create -f src/environment.yml && conda activate implant
name: implant
channels:
  - conda-forge
dependencies:
  - python=3.10
  - calculix          # provides `ccx` — the verdict engine
  - numpy>=1.24
  - scipy>=1.10
  - pip
  - pip:
      - cadquery==2.5.2
      - trimesh==4.12.2
      - gmsh==4.15.2
      - meshio==5.3.5
      - ccx2paraview==3.2.0
